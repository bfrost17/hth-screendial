[package]
name = "screendial"
version = "0.1.0"
description = "Screendial Desktop Assistant"
authors = ["Screendial Team"]
edition = "2021"

[lib]
name = "screendial_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
xcap = "0.9"
active-win-pos-rs = "0.11"
enigo = "0.6"
objc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[lints.rust]
unexpected_cfgs = { level = "allow", priority = 0 }
